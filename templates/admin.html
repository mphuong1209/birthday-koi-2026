<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hộp Thư Ước Nguyện</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: #fdf5f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255, 107, 129, 0.15);
        }
        h1 {
            color: #ff4757;
            text-align: center;
            margin-bottom: 30px;
        }
        #wishes-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .wish-card {
            background: #fff0f5;
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid #ff4757;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .wish-text {
            font-size: 1.2rem;
            line-height: 1.5;
            margin-bottom: 10px;
            color: #2f3542;
        }
        .wish-time {
            font-size: 0.9rem;
            color: #747d8c;
            text-align: right;
        }
        .empty-state {
            text-align: center;
            color: #a4b0be;
            font-style: italic;
            padding: 40px;
        }
        .auto-update-text {
            text-align: center;
            font-size: 0.8rem;
            color: #2ed573;
            margin-top: -20px;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💌 Hộp Thư Ước Nguyện Của Anh Gấu 🐻</h1>
        <div class="auto-update-text">🟢 Đang tự động cập nhật tin nhắn mới...</div>
        
        <div id="wishes-container">
            <div class="empty-state">Đang tải dữ liệu...</div>
        </div>
    </div>

    <script>
        const container = document.getElementById('wishes-container');
        let previousDataString = "";

        async function fetchWishes() {
            try {
                const response = await fetch('/api/get_wishes');
                const wishes = await response.json();
                
                // Tránh render lại liên tục nếu dữ liệu không đổi (chống giật)
                const currentDataString = JSON.stringify(wishes);
                if (currentDataString === previousDataString) return;
                previousDataString = currentDataString;
                
                container.innerHTML = "";
                
                if (wishes.length > 0) {
                    wishes.forEach(wish => {
                        const card = document.createElement('div');
                        card.className = 'wish-card';
                        
                        const text = document.createElement('div');
                        text.className = 'wish-text';
                        text.textContent = `"${wish.text}"`;
                        
                        const time = document.createElement('div');
                        time.className = 'wish-time';
                        time.textContent = wish.timestamp;
                        
                        card.appendChild(text);
                        card.appendChild(time);
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = `<div class="empty-state">Hiện tại chưa có lời ước nguyện nào... Hãy chờ anh gấu viết nhé! 💖</div>`;
                }
            } catch (error) {
                console.error("Error fetching wishes:", error);
            }
        }

        // Tải ngay lập tức
        fetchWishes();
        // Cập nhật mỗi 2 giây
        setInterval(fetchWishes, 2000);
    </script>
</body>
</html>
